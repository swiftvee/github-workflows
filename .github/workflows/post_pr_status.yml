name: Post PR status to Slack

on:
  pull_request:
    types:
      - opened
      - reopened
      - edited
      - converted_to_draft
      - ready_for_review
      - closed
  pull_request_review:
    types:
      - submitted
      - dismissed

permissions:
  pull-requests: read

jobs:
  slack_message:
    uses: ./.github/workflows/pr_slack_message.yml
    secrets:
      slack-token: ${{ secrets.SLACK_PR_STATUS_TOKEN }}
